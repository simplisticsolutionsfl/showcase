<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Showcase</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0b0b;
      font-family: Arial, Helvetica, sans-serif;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #252525 0%, #0b0b0b 70%);
    }

    .brand {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.58);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    .brand img {
      height: 38px;
      width: auto;
      max-width: 160px;
      object-fit: contain;
      border-radius: 6px;
      display: block;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .brand-subtitle {
      font-size: 12px;
      opacity: 0.78;
      margin-top: 2px;
    }

    .hint {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 10;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.58);
      padding: 9px 13px;
      border-radius: 12px;
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    .progress-wrap {
      width: 240px;
      max-width: 70vw;
      height: 6px;
      border-radius: 999px;
      overflow: hidden;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.22);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #ffffff;
      transition: width 0.2s ease;
    }

    .loading-label {
      position: absolute;
      left: 50%;
      top: calc(50% + 18px);
      transform: translateX(-50%);
      color: rgba(255,255,255,0.85);
      font-size: 13px;
      pointer-events: none;
    }

    model-viewer[loaded] .progress-wrap,
    model-viewer[loaded] .loading-label {
      display: none;
    }

    .error {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 20;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      background: #0b0b0b;
      padding: 24px;
      font-size: 15px;
    }
  </style>
</head>

<body>
  <div class="brand">
    <img
      src="https://static.wixstatic.com/media/28eddb_17e892a137a940aa9d34842bf6afad76~mv2.jpg"
      alt="Company Logo"
    />
    <div class="brand-text">
      <div class="brand-title">3D Project Showcase</div>
      <div class="brand-subtitle">Interactive model viewer</div>
    </div>
  </div>

  <model-viewer
    id="viewer"
    src="1.glb"
    camera-controls
    auto-rotate
    auto-rotate-delay="1500"
    rotation-per-second="18deg"
    interaction-prompt="auto"
    shadow-intensity="0.8"
    exposure="1"
    environment-image="neutral"
    loading="eager"
    reveal="auto"
    bounds="tight"
    ar
  >
    <div class="progress-wrap" slot="progress-bar">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="loading-label">Loading 3D model…</div>
  </model-viewer>

  <div class="hint">Drag to rotate · Scroll or pinch to zoom</div>

  <div class="error" id="errorBox">
    The 3D model could not be loaded.<br />
    Confirm that <strong>1.glb</strong> is uploaded in the same folder as this page.
  </div>

  <script>
    document.addEventListener("contextmenu", event => event.preventDefault());

    const viewer = document.getElementById("viewer");
    const progressBar = document.getElementById("progressBar");
    const errorBox = document.getElementById("errorBox");

    viewer.addEventListener("progress", event => {
      const progress = Math.round(event.detail.totalProgress * 100);
      progressBar.style.width = progress + "%";
    });

    viewer.addEventListener("error", () => {
      errorBox.style.display = "flex";
    });
  </script>
</body>
</html>
